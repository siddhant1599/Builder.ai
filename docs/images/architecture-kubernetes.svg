<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="1110" viewBox="0 0 1040 1110" role="img" aria-labelledby="previews-title previews-desc">
<title id="previews-title">Builder.ai Kubernetes preview architecture</title>
<desc id="previews-desc">The browser reaches a reverse proxy that resolves project hostnames through Redis. Workspace uses Fabric8 to start runner pods. Each pod shares a volume between a Vite runner and a MinIO syncer, in a separate preview namespace governed by network policies.</desc>
