<text x="42" y="55" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="700" fill="#0f172a" text-anchor="start">Kubernetes previews</text><text x="42" y="91" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="#475569" text-anchor="start">A runner pool executes projects; a proxy exposes their live previews.</text>
