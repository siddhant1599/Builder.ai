<text x="42" y="1190" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400" fill="#0f172a" text-anchor="start">Each service has a separate PostgreSQL database; cross-service IDs are logical links.</text>
<text x="42" y="1225" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400" fill="#475569" text-anchor="start">* Active preview state lives in Kubernetes pod labels and Redis routes.</text>
