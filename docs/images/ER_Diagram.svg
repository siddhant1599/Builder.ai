<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="1262" viewBox="0 0 1040 1262" role="img" aria-labelledby="data-model-title data-model-desc">
<title id="data-model-title">Builder.ai data model</title>
<desc id="data-model-desc">A compact data model grouped into Account, Workspace and Intelligence databases. Users subscribe to plans and are referenced by project memberships, chat sessions and daily usage. Projects contain files and have runtime previews. Chat sessions contain messages and ordered events.</desc>
