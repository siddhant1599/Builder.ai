<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="1110" viewBox="0 0 1040 1110" role="img" aria-labelledby="microservices-title microservices-desc">
<title id="microservices-title">Builder.ai microservices architecture</title>
<desc id="microservices-desc">Browser requests pass through a JWT-validating gateway to Account, Workspace and Intelligence. Kafka connects file generation to storage; each service owns its data. Config, Eureka and common-lib support the backend.</desc>
