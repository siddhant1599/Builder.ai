<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="1154" viewBox="0 0 1040 1154" role="img" aria-labelledby="ai-generation-title ai-generation-desc">
<title id="ai-generation-title">Builder.ai AI generation and storage</title>
<desc id="ai-generation-desc">User prompts, system rules and project files feed Spring AI. Output streams to React and is parsed into chat events. PostgreSQL stores chat data; Kafka asks Workspace to store files in MinIO and metadata in PostgreSQL, then returns a storage result.</desc>
